
name: Hospital Equipment Planner CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/srinivas-26-06/hospital-equipment-planner-backend
  FRONTEND_IMAGE: ghcr.io/srinivas-26-06/hospital-equipment-planner-frontend
  ANALYTICS_IMAGE: ghcr.io/srinivas-26-06/hospital-equipment-planner-analytics

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

      - name: Build and push analytics
        uses: docker/build-push-action@v6
        with:
          context: ./analytics
          push: true
          tags: |
            ${{ env.ANALYTICS_IMAGE }}:latest
            ${{ env.ANALYTICS_IMAGE }}:${{ github.sha }}

  deploy-to-ec2:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Add EC2 host to known hosts
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}

      - name: Copy production configuration to EC2
        run: |
          set -e

          REMOTE="$EC2_USERNAME@$EC2_HOST"
          REMOTE_DIR="/home/ubuntu/hospital-equipment-planner"

          ssh "$REMOTE" "
            mkdir -p '$REMOTE_DIR/nginx'
            mkdir -p '$REMOTE_DIR/scripts'
          "

          scp docker-compose.prod.yml \
            "$REMOTE:$REMOTE_DIR/docker-compose.prod.yml.tmp"

          scp nginx/default.conf \
            "$REMOTE:$REMOTE_DIR/nginx/default.conf.tmp"

          scp scripts/renew-cert.sh \
            "$REMOTE:$REMOTE_DIR/scripts/renew-cert.sh.tmp"

          ssh "$REMOTE" "
            set -e

            cd '$REMOTE_DIR'

            mv docker-compose.prod.yml.tmp docker-compose.prod.yml
            mv nginx/default.conf.tmp nginx/default.conf
            mv scripts/renew-cert.sh.tmp scripts/renew-cert.sh

            chmod +x scripts/renew-cert.sh
          "
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}

      - name: Validate and deploy application
        run: |
          ssh "$EC2_USERNAME@$EC2_HOST" '
            set -e

            cd /home/ubuntu/hospital-equipment-planner

            echo "Validating production configuration..."

            docker compose \
              --env-file .env.prod \
              -f docker-compose.prod.yml \
              config --quiet

            echo "Pulling latest Docker images..."

            docker compose \
              --env-file .env.prod \
              -f docker-compose.prod.yml \
              pull

            echo "Deploying application..."

            docker compose \
              --env-file .env.prod \
              -f docker-compose.prod.yml \
              up -d --remove-orphans

            echo "Recreating Nginx to refresh container connections..."

            docker compose \
              --env-file .env.prod \
              -f docker-compose.prod.yml \
              up -d --force-recreate nginx

            echo "Checking deployment status..."

            docker compose \
              --env-file .env.prod \
              -f docker-compose.prod.yml \
              ps

            echo "Deployment completed successfully."
          '
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
