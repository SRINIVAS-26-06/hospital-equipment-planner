
name: Hospital Equipment Planner CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/srinivas-26-06/hospital-equipment-planner-backend
  FRONTEND_IMAGE: ghcr.io/srinivas-26-06/hospital-equipment-planner-frontend
  ANALYTICS_IMAGE: ghcr.io/srinivas-26-06/hospital-equipment-planner-analytics

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

      - name: Build and push analytics
        uses: docker/build-push-action@v6
        with:
          context: ./analytics
          push: true
          tags: |
            ${{ env.ANALYTICS_IMAGE }}:latest
            ${{ env.ANALYTICS_IMAGE }}:${{ github.sha }}
