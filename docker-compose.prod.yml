
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: planner
      POSTGRES_USER: planner
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planner -d planner"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    image: ghcr.io/srinivas-26-06/hospital-equipment-planner-backend:latest
    environment:
      DB_URL: jdbc:postgresql://db:5432/planner
      DB_USER: planner
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      PLANNER_ADMIN_PASSWORD: ${PLANNER_ADMIN_PASSWORD:?Required}
      PLANNER_ENGINEER_PASSWORD: ${PLANNER_ENGINEER_PASSWORD:?Required}
      PLANNER_STAFF_PASSWORD: ${PLANNER_STAFF_PASSWORD:?Required}
      PLANNER_VIEWER_PASSWORD: ${PLANNER_VIEWER_PASSWORD:?Required}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8080"
    restart: unless-stopped

  frontend:
    image: ghcr.io/srinivas-26-06/hospital-equipment-planner-frontend:latest
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sed -i 's/listen 80;/listen 8081;/' /etc/nginx/conf.d/default.conf
        exec nginx -g 'daemon off;'
    expose:
      - "8081"
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    restart: unless-stopped
  outbox-worker:
    image: ghcr.io/srinivas-26-06/hospital-equipment-planner-analytics:latest
    entrypoint: ["python", "outbox_worker.py"]
    environment:
      DATABASE_URL: postgresql://planner:${DB_PASSWORD:?Required}@db:5432/planner
      S3_BUCKET: ${S3_BUCKET:?Required}
      OUTBOX_S3_PREFIX: hospital-equipment/outbox/events/
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      OUTBOX_BATCH_SIZE: 20
      OUTBOX_POLL_INTERVAL: 10
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  incremental-processor:
    image: ghcr.io/srinivas-26-06/hospital-equipment-planner-analytics:latest
    entrypoint: ["python", "incremental_processor.py"]
    environment:
      DATABASE_URL: postgresql://planner:${DB_PASSWORD:?Required}@db:5432/planner
      S3_BUCKET: ${S3_BUCKET:?Required}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      OUTBOX_NOTIFICATION_QUEUE_URL: https://sqs.ap-south-1.amazonaws.com/399258986697/hospital-equipment-outbox-notifications
      PROCESSOR_POLL_INTERVAL: 10
      EXPORT_SALT: ${EXPORT_SALT:?Required}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
