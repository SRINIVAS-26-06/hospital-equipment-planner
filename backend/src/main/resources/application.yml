spring:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate      # the schema is owned by Flyway; Hibernate only checks it matches the entities
    properties:
      hibernate:
        jdbc.time_zone: UTC
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/planner}
    username: ${DB_USER:planner}
    password: ${DB_PASSWORD:planner}
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jackson:
    default-property-inclusion: always
server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health
planner:
  underused-below: 0.30
  overworked-above: 0.85
  alerts:
    initial-delay-ms: 60000
    interval-ms: 900000
  users:
    # initial accounts are created on first start only; override ALL of these via environment
    viewer-password: ${PLANNER_VIEWER_PASSWORD:viewer-dev}
    staff-password: ${PLANNER_STAFF_PASSWORD:staff-dev}
    engineer-password: ${PLANNER_ENGINEER_PASSWORD:engineer-dev}
    admin-password: ${PLANNER_ADMIN_PASSWORD:admin-dev}
